<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.webmanifest">
<title>Ball Splitter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f7f8fc;font:16px system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:auto;padding:16px;display:grid;gap:13px}
h1{font-size:24px;margin:3px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#18263a;border:1px solid #34445d;border-radius:13px;padding:10px;text-align:center}
.stat small{display:block;color:#aab8cb;font-size:11px;letter-spacing:.08em}.stat strong{font-size:21px}
canvas{width:100%;aspect-ratio:1;display:block;background:#101827;border-radius:18px;touch-action:manipulation}
.speed{text-align:center;font-weight:700}.controls{display:flex;gap:9px}
button{flex:1;border:1px solid #465873;background:#1b2a40;color:white;border-radius:12px;padding:13px 8px;font-weight:700;font-size:15px}
button:active{transform:scale(.98)}#restart{flex:0 0 auto}
.meter{height:9px;background:#34445d;border-radius:20px;overflow:hidden}.meter div{height:100%;width:0;background:#ff647d}
.note{text-align:center;color:#aab8cb;font-size:12px}#message{text-align:center;min-height:22px;color:#dce7f6}
</style>
</head>
<body>
<main>
<h1>🔴 Ball Splitter</h1>
<section class="stats">
 <div class="stat"><small>BALLS</small><strong id="count">1</strong></div>
 <div class="stat"><small>BARRIER DAMAGE</small><strong id="damageText">0%</strong></div>
 <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
</section>
<canvas id="game"></canvas>
<div class="speed">⚡ SWORD SPEED: <span id="speedText">1.0×</span></div>
<div class="controls"><button id="slower">− Slower</button><button id="faster">+ Faster</button></div>
<div class="controls"><button id="sound">🔇 Enable sound</button></div>
<div class="meter"><div id="damageBar"></div></div>
<div id="message">The sword spins automatically. Balls multiply when hit!</div>
<div class="controls"><button id="restart">↻ Restart</button></div>
<p class="note">Goal: multiply the balls, crack the inner ring, and break it. Maximum: 200,000 balls.</p>
</main>
<script>
(()=>{
'use strict';
const MAX=200000, COLORS=['#ff5577','#ffc857','#48d9bd','#65a5ff','#c28aff','#ff8e45','#f4f06b'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,cx=0,cy=0,R=0,ring=0,angle=0,speed=1,damage=0,broken=false,won=false,last=0,raf=0;
let balls=[],fragments=[];
let audioCtx=null,soundOn=false;
function audioReady(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return false;
 if(!audioCtx)audioCtx=new AC();
 if(audioCtx.state==='suspended')audioCtx.resume();
 return true;
}
function tone(freq,duration,type='sine',volume=.045,slide=0){
 if(!soundOn||!audioReady())return;
 const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,now);
 if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),now+duration);
 gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+duration);
}
function splitSound(){tone(620,.09,'triangle',.035,360);}
function breakSound(){tone(180,.35,'sawtooth',.07,-110);setTimeout(()=>tone(90,.45,'triangle',.06,-35),90);}

function resize(){
 const rect=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 W=rect.width;H=W;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);
 ctx.setTransform(d,0,0,d,0,0);cx=W/2;cy=H*.47;R=W*.435;ring=R*.66;
}
function reset(){
 cancelAnimationFrame(raf);angle=0;damage=0;broken=false;won=false;last=0;fragments=[];
 balls=[{x:cx,y:cy-ring*.35,vx:80,vy:55,r:8,c:0,cd:0}];
 $('message').textContent='The sword spins automatically. Balls multiply when hit!';
 updateStats();raf=requestAnimationFrame(loop);
}
function updateStats(){
 $('count').textContent=balls.length.toLocaleString();
 $('damageText').textContent=Math.round(damage)+'%';
 $('damageBar').style.width=damage+'%';
 $('level').textContent=1+Math.floor(balls.length/100);
}
function multiply(b,out){
 if(balls.length+out.length+2>MAX)return false;
 const r=Math.max(1.35,b.r*.77),a=Math.atan2(b.vy,b.vx)+Math.PI/2;
 for(let k of [-1,1]){
  const z=a+k*.52;
  out.push({x:b.x+Math.cos(z)*r*.6,y:b.y+Math.sin(z)*r*.6,
   vx:b.vx*.55+Math.cos(z)*95,vy:b.vy*.55+Math.sin(z)*95,
   r,c:(b.c+1+(k===1?2:0))%COLORS.length,cd:.48});
 }
 return true;
}
function breakRing(){
 if(broken)return;broken=true;
 for(let i=0;i<28;i++){let a=i*Math.PI*2/28;fragments.push({x:cx+Math.cos(a)*ring,y:cy+Math.sin(a)*ring,vx:Math.cos(a)*100,vy:Math.sin(a)*100,life:1});}
 $('message').textContent='💥 The barrier shattered! Balls are falling!';breakSound();
}
function loop(t){
 const dt=Math.min((t-last)/1000||0,.025);last=t;angle+=dt*1.1*speed;
 const sx=cx+Math.cos(angle)*ring*.9,sy=cy+Math.sin(angle)*ring*.9;
 const ex=cx+Math.cos(angle)*ring*.12,ey=cy+Math.sin(angle)*ring*.12;
 const ux=sx-ex,uy=sy-ey,den=ux*ux+uy*uy;
 let out=[],pressure=0;
 for(let b of balls){
  b.cd=Math.max(0,b.cd-dt);b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(!broken){
   const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);
   if(d+b.r>ring){
    const nx=dx/(d||1),ny=dy/(d||1);
    b.x=cx+nx*(ring-b.r);b.y=cy+ny*(ring-b.r);
    const dot=b.vx*nx+b.vy*ny;
    if(dot>0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;pressure+=.0007;}
   }
  }else{
   b.vy+=190*dt;
   if(b.y>H+12){b.y=-8;b.x=Math.random()*W;b.vy=70+Math.random()*100;}
   if(b.x<-12)b.x=W+8;if(b.x>W+12)b.x=-8;
  }
  const q=Math.max(0,Math.min(1,((b.x-ex)*ux+(b.y-ey)*uy)/den));
  const px=ex+q*ux,py=ey+q*uy;
  if(b.cd<=0&&Math.hypot(b.x-px,b.y-py)<b.r+5&&balls.length+out.length+2<=MAX){
   if(multiply(b,out)){splitSound();continue;}
  }
  out.push(b);
 }
 balls=out;
 if(!broken){damage=Math.min(100,damage+pressure+balls.length*.00000012);if(damage>=100)breakRing();}
 ctx.fillStyle='#101827';ctx.fillRect(0,0,W,H);
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='#91a9c8';ctx.lineWidth=3;ctx.stroke();
 if(!broken){
  ctx.beginPath();ctx.arc(cx,cy,ring,0,Math.PI*2);ctx.strokeStyle='#e8d5a9';ctx.lineWidth=9;ctx.stroke();
  if(damage>12){for(let i=0;i<Math.floor(damage/7);i++){let a=i*2.4+damage*.03;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*ring,cy+Math.sin(a)*ring);ctx.lineTo(cx+Math.cos(a+.06)*(ring+10),cy+Math.sin(a+.06)*(ring+10));ctx.strokeStyle='#ff617b';ctx.lineWidth=2;ctx.stroke();}}
 }else{
  for(const f of fragments){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=100*dt;ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#e8d5a9';ctx.fillRect(f.x,f.y,5,5);}ctx.globalAlpha=1;
  ctx.beginPath();ctx.moveTo(0,H*.9);ctx.lineTo(W,H*.9);ctx.strokeStyle='#53677d';ctx.lineWidth=3;ctx.stroke();
 }
 // Draw each ball; rendering is capped for smoothness, while the counter remains exact.
 const stride=Math.max(1,Math.ceil(balls.length/4500));
 for(let i=0;i<balls.length;i+=stride){const b=balls[i];ctx.beginPath();ctx.arc(b.x,b.y,Math.max(1.2,b.r),0,Math.PI*2);ctx.fillStyle=COLORS[b.c];ctx.fill();}
 ctx.save();ctx.shadowBlur=14;ctx.shadowColor='#ff546d';ctx.strokeStyle='#ff546d';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(sx,sy);ctx.stroke();ctx.restore();
 updateStats();
 if(balls.length>=MAX){won=true;$('message').textContent='🎉 200,000 BALLS — YOU WIN!';return;}
 raf=requestAnimationFrame(loop);
}
function setSpeed(v){speed=Math.max(.2,Math.min(5,Math.round(v*10)/10));$('speedText').textContent=speed.toFixed(1)+'×';}
$('slower').addEventListener('click',()=>setSpeed(speed-.2));
$('faster').addEventListener('click',()=>setSpeed(speed+.2));
$('restart').addEventListener('click',()=>{audioReady();tone(440,.08);reset();});
$('sound').addEventListener('click',()=>{
 soundOn=!soundOn;
 if(soundOn){audioReady();$('sound').textContent='🔊 Sound ON';tone(660,.12,'sine',.05,180);}
 else $('sound').textContent='🔇 Enable sound';
});
$('slower').addEventListener('click',()=>{audioReady();tone(330,.06);setSpeed(speed-.2);});
$('faster').addEventListener('click',()=>{audioReady();tone(520,.06);setSpeed(speed+.2);});
new ResizeObserver(()=>{resize();}).observe(canvas);resize();reset();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
